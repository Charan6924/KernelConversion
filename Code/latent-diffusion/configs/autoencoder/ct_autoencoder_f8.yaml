model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.VQModel
  params:
    embed_dim: 4
    n_embed: 16384
    monitor: val/rec_loss
    ddconfig:
      double_z: false
      z_channels: 4
      resolution: 512
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult:
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 32
      dropout: 0.0
    lossconfig:
      target: ldm.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 1
        disc_start: 10000
        disc_weight: 0.75
        codebook_weight: 1.0
        n_classes: 16384

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 4
    wrap: false
    train:
      target: ldm.data.ct_pairs.CTAutoencoderTrain
      params:
        root_dir: /mnt/vstor/CSE_BME_DLW/cxv166/Data_Root
        sharp_subdir: trainA
        preload: False
    validation:
      target: ldm.data.ct_pairs.CTAutoencoderValidation
      params:
        root_dir: /mnt/vstor/CSE_BME_DLW/cxv166/Data_Root
        sharp_subdir: testA
        preload: False

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False
  trainer:
    benchmark: True
    max_epochs: 100
